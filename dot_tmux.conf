# Ported from the tmux configuration in vps-nix/modules/home/shell.nix.
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
setw -g clock-mode-style 24
set -s escape-time 10
set -g history-limit 10000
set -g mouse off
set -g mode-keys emacs

# Ctrl-Space prefix; press it twice to send it to the application.
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Preserve modifier information, including Shift-Enter.
set -g extended-keys on
set -g extended-keys-format csi-u

# Move between panes with Alt-arrow keys without the prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Open windows and split panes in the current working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Preserve the VPS terminal support and include this repo's Ghostty terminal.
set -as terminal-features ",alacritty*:RGB,foot*:RGB,xterm-kitty*:RGB,xterm-ghostty*:RGB"
set -as terminal-features ",alacritty*:hyperlinks,foot*:hyperlinks,xterm-kitty*:hyperlinks,xterm-ghostty*:hyperlinks"
set -as terminal-features ",alacritty*:usstyle,foot*:usstyle,xterm-kitty*:usstyle,xterm-ghostty*:usstyle"
set -as terminal-overrides ",alacritty*:Tc,foot*:Tc,xterm-kitty*:Tc,xterm-256color:Tc,xterm-ghostty*:Tc"

# Reset environment synchronization to tmux's default variable list.
set -gu update-environment

bind R source-file '~/.tmux.conf'

# Palette from the Nix configuration.
set -g @mocha-rosewater "#ea6962"
set -g @mocha-red       "#ea6962"
set -g @mocha-pink      "#d3869b"
set -g @mocha-mauve     "#d3869b"
set -g @mocha-peach     "#e78a4e"
set -g @mocha-yellow    "#d8a657"
set -g @mocha-green     "#a9b665"
set -g @mocha-teal      "#89b482"
set -g @mocha-blue      "#7daea3"
set -g @mocha-text      "#ebdbb2"
set -g @mocha-subtext0  "#bdae93"
set -g @mocha-overlay0  "#595959"
set -g @mocha-surface0  "#292929"
set -g @mocha-base      "#1d2021"
set -g @mocha-mantle    "#191b1c"
set -g @mocha-crust     "#141617"

# Status bar.
set -g status-style       "bg=#{@mocha-base},fg=#{@mocha-text}"
set -g status-left-style  "bg=#{@mocha-mantle},fg=#{@mocha-peach},bold"
set -g status-left        "#[nodim] #S #[default]"
set -g status-right-style "fg=#{@mocha-teal}"

# Windows.
setw -g window-status-current-style  'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style          'fg=red bg=black'
setw -g window-status-format         ' #I #[fg=white]#W #[fg=yellow]#F '
setw -g window-status-bell-style     'fg=yellow bg=red bold'

# Pane borders and command messages.
set -g pane-border-style        "fg=#{@mocha-overlay0}"
set -g pane-active-border-style "fg=#{@mocha-red}"
set -g message-style            "bg=#{@mocha-surface0},fg=#{@mocha-text}"
set -g message-command-style    "bg=#{@mocha-surface0},fg=#{@mocha-text}"

# Plugins are installed by chezmoi from pinned upstream archives.
run-shell '~/.tmux/plugins/tmux-fzf/main.tmux'
run-shell '~/.tmux/plugins/extrakto/extrakto.tmux'
